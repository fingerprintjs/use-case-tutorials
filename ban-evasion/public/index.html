<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ticket Marketplace</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="config.js"></script>
    <script src="index.js" defer></script>
  </head>

  <body class="bg-gray-50 min-h-screen flex items-start justify-center p-6">
    <div class="w-full max-w-3xl space-y-6">
      <!-- Admin toggle -->
      <div class="flex justify-end">
        <button
          id="adminToggle"
          type="button"
          class="text-xs font-medium text-gray-600 hover:text-orange-700 border border-gray-200 rounded-full px-3 py-1 bg-gray-50"
        >
          Admin mode
        </button>
      </div>

      <!-- Listings -->
      <div>
        <h2 class="text-xl font-semibold text-gray-900">
          Ticket Reseller Marketplace
        </h2>
        <p class="text-sm text-gray-600">
          Buy and sell tickets for concerts, events, and more.
        </p>
        <div id="listings" class="mt-4 space-y-3"></div>
      </div>

      <!-- Listing form -->
      <div
        class="bg-white rounded-xl border border-gray-200 shadow-sm p-6 space-y-4"
      >
        <h2 class="text-lg font-semibold text-gray-900">List your tickets</h2>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label
              for="eventNameInput"
              class="block text-sm font-medium text-gray-800 mb-1"
            >
              Event name
            </label>
            <input
              id="eventNameInput"
              type="text"
              placeholder="Artist or tour name"
              class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-orange-500"
            />
          </div>

          <div>
            <label
              for="dateInput"
              class="block text-sm font-medium text-gray-800 mb-1"
            >
              Date
            </label>
            <input
              id="dateInput"
              type="date"
              class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-orange-500"
            />
          </div>

          <div>
            <label
              for="venueInput"
              class="block text-sm font-medium text-gray-800 mb-1"
            >
              Venue
            </label>
            <input
              id="venueInput"
              type="text"
              placeholder="Venue name"
              class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-orange-500"
            />
          </div>

          <div class="grid grid-cols-2 gap-4">
            <!-- Price -->
            <div>
              <label
                for="priceInput"
                class="block text-sm font-medium text-gray-800 mb-1"
              >
                Price
              </label>
              <input
                id="priceInput"
                type="number"
                min="0"
                step="1"
                placeholder="$45"
                class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-orange-500"
              />
            </div>

            <!-- Ticket count -->
            <div>
              <label
                for="ticketCountInput"
                class="block text-sm font-medium text-gray-800 mb-1"
              >
                Ticket count
              </label>
              <input
                id="countInput"
                type="number"
                min="1"
                step="1"
                placeholder="2"
                class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-orange-500"
              />
            </div>
          </div>

          <div>
            <label
              for="sectionInput"
              class="block text-sm font-medium text-gray-800 mb-1"
            >
              Seat description
            </label>
            <input
              id="sectionInput"
              type="text"
              placeholder="Section 112, Row D, Seats 13-14, etc."
              class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-orange-500"
            />
          </div>

          <div>
            <label
              for="sellerEmailInput"
              class="block text-sm font-medium text-gray-800 mb-1"
            >
              Your email
            </label>
            <input
              id="sellerEmailInput"
              type="email"
              placeholder="you@example.com"
              class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-orange-500"
            />
          </div>
        </div>

        <div class="flex justify-end items-center gap-2">
          <button
            id="submitBtn"
            type="button"
            class="rounded-lg bg-orange-500 hover:bg-orange-600 text-white px-6 py-2 text-sm font-medium"
          >
            Post listing
          </button>
        </div>
      </div>

      <!-- Reset link -->
      <p
        id="resetDBLink"
        class="text-center text-sm text-gray-400 hover:text-gray-600 mt-4 cursor-pointer"
      >
        Reset demo
      </p>
    </div>

    <!-- Result modal -->
    <div
      id="resultModal"
      class="hidden flex fixed inset-0 bg-black bg-opacity-30 items-center justify-center p-4"
    >
      <div
        class="flex items-center justify-between bg-white rounded-lg shadow-lg p-4 max-w-sm w-full"
      >
        <p id="resultModalMessage" class="text-sm text-gray-800"></p>

        <button
          id="resultModalClose"
          type="button"
          class="text-gray-400 hover:text-gray-600 text-lg leading-none"
          aria-label="Close"
        >
          &times;
        </button>
      </div>
    </div>

    <!-- Listing template -->
    <template id="listingTmpl">
      <div
        class="border border-gray-200 bg-white rounded-lg p-4 flex gap-4 items-center"
        data-listing-id
      >
        <div
          class="h-12 w-12 rounded-md bg-orange-100 flex items-center justify-center text-orange-600 text-xl font-medium"
          data-ticket-count-display
        ></div>

        <div class="flex-1 space-y-1">
          <div class="flex justify-between items-center">
            <p class="text-sm font-semibold text-gray-900" data-event-name></p>
            <p class="text-sm font-semibold text-gray-900" data-price></p>
          </div>

          <div class="flex justify-between items-center">
            <div>
              <p class="text-xs text-gray-600">
                <span data-event-date></span> · <span data-venue></span>
              </p>
              <p class="text-xs text-gray-500">
                <span data-ticket-description></span> ·
                <span data-ticket-count></span> ticket(s) · Seller:
                <span class="font-medium" data-seller-email></span>
              </p>
            </div>

            <button
              class="mt-2 px-3 py-1 rounded bg-orange-500 hover:bg-orange-600 text-white text-xs font-medium"
              type="button"
            >
              Buy
            </button>
          </div>
        </div>

        <!-- Admin controls -->
        <div
          class="admin-controls hidden flex flex-col gap-1 text-right text-xs"
        >
          <button
            type="button"
            class="px-2 py-1 rounded bg-red-50 text-red-600 border border-red-200 hover:bg-red-100"
            data-action="ban"
          >
            Ban seller
          </button>
          <button
            type="button"
            class="px-2 py-1 rounded bg-gray-50 text-gray-700 border border-gray-200 hover:bg-gray-100"
            data-action="remove"
          >
            Remove listing
          </button>
        </div>
      </div>
    </template>
  </body>
</html>
