<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Events • Fingerprint Tickets</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="config.js"></script>
    <script src="index.js" defer></script>
  </head>

  <body class="bg-gray-50 min-h-screen">
    <div class="max-w-6xl mx-auto px-6 py-8 space-y-6">
      <!-- Top bar -->
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-2xl font-semibold text-gray-900">
            Fingerprint Tickets
          </h1>
          <div class="flex items-center gap-3">
            <p class="text-sm text-gray-600">
              Signed in as
              <span class="font-medium">jamie@example.com</span>
            </p>
            <span class="text-gray-300">•</span>
            <a
              href="/order-history"
              class="text-sm text-gray-600 hover:text-gray-900 underline"
            >
              Order history
            </a>
          </div>
        </div>

        <div class="text-right">
          <a
            href="/admin"
            class="inline-flex items-center gap-1.5 text-sm font-medium text-orange-600 hover:text-orange-700 border border-orange-300 hover:border-orange-400 rounded-full px-4 py-1 bg-white hover:bg-orange-50"
          >
            Merchant view
            <span class="text-orange-500">→</span>
          </a>
        </div>
      </div>

      <!-- Events grid -->
      <div class="space-y-3">
        <h2 class="text-lg font-semibold text-gray-900">Upcoming events</h2>
        <div
          id="eventsGrid"
          class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"
        ></div>
      </div>

      <!-- Reset link -->
      <p
        id="reset"
        class="text-center text-sm text-gray-400 hover:text-gray-600 mt-4 cursor-pointer"
      >
        Reset demo
      </p>
    </div>

    <!-- Event Card Template -->
    <template id="eventCardTemplate">
      <div
        class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden flex flex-col"
        data-event-id=""
      >
        <div class="aspect-video bg-orange-50 overflow-hidden relative">
          <img
            src=""
            alt=""
            class="absolute inset-0 w-full h-full object-cover"
            data-event-image
          />
        </div>
        <div class="p-4 flex flex-col gap-2 flex-1">
          <h3 class="text-sm font-semibold text-gray-900" data-event-name>
            Event Name
          </h3>
          <p class="text-xs text-gray-600" data-event-date-venue>
            Date · Venue
          </p>
          <p class="text-xs text-gray-500" data-event-location>Location</p>
          <div class="flex items-center justify-between mt-2">
            <p class="text-sm font-semibold text-gray-900" data-price>$0.00</p>
            <button
              type="button"
              class="px-3 py-1.5 rounded-md bg-orange-500 hover:bg-orange-600 text-white text-xs font-medium"
              data-action="buy"
            >
              Buy now
            </button>
          </div>
        </div>
      </div>
    </template>

    <!-- Purchase Modal -->
    <div
      id="purchaseModal"
      class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black bg-opacity-50"
    >
      <div
        class="bg-white rounded-xl shadow-xl max-w-lg w-full max-h-[90vh] overflow-y-auto"
      >
        <!-- Modal Header -->
        <div class="p-6 border-b border-gray-200">
          <div class="flex items-center justify-between">
            <h2 class="text-xl font-semibold text-gray-900" id="modalEventName">
              Event Name
            </h2>
            <button
              type="button"
              class="text-gray-400 hover:text-gray-600"
              id="modalClose"
            >
              <span class="sr-only">Close</span>
              <svg
                class="w-6 h-6"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M6 18L18 6M6 6l12 12"
                />
              </svg>
            </button>
          </div>
          <div class="mt-2 space-y-1" id="modalEventDetails">
            <p class="text-sm text-gray-600">Event details</p>
          </div>
        </div>

        <!-- Modal Body -->
        <div class="p-6 space-y-6">
          <!-- Tickets Section -->
          <div>
            <label
              for="ticketQuantity"
              class="block text-sm font-medium text-gray-700 mb-2"
            >
              Number of tickets
            </label>
            <select
              id="ticketQuantity"
              name="ticketQuantity"
              class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-orange-500 focus:border-orange-500"
            >
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
            </select>
          </div>

          <!-- Credit Card Section -->
          <div>
            <label
              for="creditCard"
              class="block text-sm font-medium text-gray-700 mb-2"
            >
              Payment method
            </label>
            <select
              id="creditCard"
              name="creditCard"
              class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-orange-500 focus:border-orange-500 mb-2"
            >
              <option value="card1">•••• •••• •••• 4242</option>
              <option value="card2">•••• •••• •••• 8888</option>
            </select>
            <a
              href="#"
              class="text-sm text-gray-500 hover:text-gray-700 underline"
              id="addNewCard"
            >
              Add a new card
            </a>
          </div>

          <!-- Delivery Section -->
          <div>
            <label
              for="deliveryEmail"
              class="block text-sm font-medium text-gray-700 mb-2"
            >
              Delivery email
            </label>
            <input
              type="email"
              id="deliveryEmail"
              name="deliveryEmail"
              value="jamie@example.com"
              placeholder="your.email@example.com"
              class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-orange-500 focus:border-orange-500"
            />
          </div>
        </div>

        <!-- Modal Footer -->
        <div class="p-6 border-t border-gray-200 bg-gray-50">
          <button
            type="button"
            id="purchaseButton"
            class="w-full px-4 py-2 bg-orange-500 hover:bg-orange-600 text-white font-medium rounded-md transition-colors"
          >
            Complete purchase
          </button>

          <!-- Result message -->
          <div
            id="resultBox"
            class="hidden mt-4 text-sm px-4 py-2 rounded flex justify-between items-center"
          >
            <span id="resultMessage"></span>
            <button id="clearResult" type="button" aria-label="Close message">
              &times;
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
