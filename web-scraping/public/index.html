<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Find flights</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="config.js"></script>
    <script src="index.js" defer></script>
  </head>

  <body class="bg-gray-50 text-gray-900">
    <div class="min-h-screen flex flex-col items-center p-6">
      <h1 class="text-2xl font-semibold text-center">Flight search</h1>

      <div class="w-full max-w-6xl mx-auto px-4 py-6">
        <!-- Search form -->
        <div class="bg-white rounded-xl shadow p-4 md:p-6">
          <div class="flex flex-col gap-4">
            <!-- First row -->
            <div
              class="w-full grid grid-cols-1 md:grid-cols-11 gap-4 items-center col-span-full"
            >
              <!-- From -->
              <label class="md:col-span-5">
                <span class="text-sm font-medium text-gray-700">From</span>
                <select
                  id="from"
                  class="h-12 mt-1 w-full rounded-lg border border-gray-200 bg-white px-3 py-3"
                ></select>
              </label>
              <!-- Arrow -->
              <div
                class="hidden md:flex items-center justify-center text-orange-500 pt-7 md:col-span-1"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-6 w-6 rotate-180"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                >
                  <path
                    d="M21 11H6.83l3.58-3.59L9 6l-6 6 6 6 1.41-1.41L6.83 13H21z"
                  />
                </svg>
              </div>
              <!-- To -->
              <label class="md:col-span-5">
                <span class="text-sm font-medium text-gray-700">To</span>
                <select
                  id="to"
                  class="h-12 mt-1 w-full rounded-lg border border-gray-200 bg-white px-3 py-3"
                ></select>
              </label>
            </div>

            <!-- Second row -->
            <div
              class="w-full grid grid-cols-1 md:grid-cols-7 gap-4 items-center col-span-full"
            >
              <!-- Date -->
              <label class="md:col-span-3">
                <span class="text-sm font-medium text-gray-700"
                  >Departure date</span
                >
                <input
                  id="departDate"
                  type="date"
                  class="h-12 mt-1 w-full rounded-lg border border-gray-200 bg-white px-3 py-3"
                />
              </label>

              <!-- Passengers -->
              <label class="md:col-span-2">
                <span class="text-sm font-medium text-gray-700"
                  >Passengers</span
                >
                <select
                  id="passengers"
                  class="h-12 mt-1 w-full rounded-lg border border-gray-200 bg-white px-3 py-3"
                >
                  <option value="1" selected>1 adult</option>
                  <option value="2">2 adults</option>
                  <option value="3">3 adults</option>
                  <option value="4">4 adults</option>
                  <option value="5">5 adults</option>
                  <option value="6">6 adults</option>
                </select>
              </label>

              <!-- Search -->
              <div class="md:col-span-2">
                <label class="invisible block text-sm font-medium text-gray-700"
                  >Search</label
                >
                <button
                  id="searchBtn"
                  class="w-full h-12 mt-1 rounded-lg bg-orange-500 text-white px-6 hover:bg-orange-600"
                >
                  Search
                </button>
              </div>
            </div>
          </div>
        </div>
        <!-- Results -->
        <div id="resultBox" class="mt-6 space-y-4"></div>
      </div>

      <!-- Result card template -->
      <template id="flightCardTmpl">
        <div class="bg-white rounded-xl shadow overflow-hidden">
          <div class="flex flex-col md:flex-row">
            <div class="p-5 w-full">
              <div class="grid grid-cols-[1fr,auto,1fr] items-center gap-3">
                <div>
                  <div class="text-2xl font-semibold" data-origin-code>---</div>
                  <div class="text-sm text-gray-500" data-origin-city></div>
                  <div class="mt-2 text-lg" data-dep-time>--:--</div>
                  <div class="text-xs text-gray-500" data-dep-date></div>
                </div>

                <div class="flex flex-col items-center">
                  <span
                    class="text-xs font-medium text-orange-600 bg-orange-50 border border-orange-200 rounded-full px-2 py-0.5"
                    >Direct</span
                  >
                  <div class="my-2 h-0.5 w-24 bg-gray-200 rounded"></div>
                  <span class="text-xs text-gray-500" data-duration
                    >0h 00m</span
                  >
                </div>

                <div class="text-right">
                  <div class="text-2xl font-semibold" data-dest-code>---</div>
                  <div class="text-sm text-gray-500" data-dest-city></div>
                  <div class="mt-2 text-lg" data-arr-time>--:--</div>
                  <div class="text-xs text-gray-500" data-arr-date></div>
                </div>
              </div>

              <div
                class="mt-5 border-t pt-2 flex justify-between items-center gap-3"
              >
                <div class="flex items-center gap-2 text-gray-500">
                  <span class="text-lg" data-airline-icon>✈️</span>
                  <span data-airline></span>
                </div>
                <div class="text-right text-gray-500 text-xs italic">
                  <span data-next-day></span>
                </div>
              </div>
            </div>

            <div
              class="w-full md:w-72 border-t md:border-t-0 md:border-l md:border-dashed md:border-l-orange-500 p-5 flex flex-col justify-between bg-gray-50/50"
            >
              <div class="text-right">
                <div class="text-sm text-gray-500">Total</div>
                <div class="text-3xl font-semibold mt-1" data-total-price>
                  $0
                </div>
                <div class="text-xs text-gray-400">
                  <span data-passengers>1</span> adult(s) &times;
                  <span data-price>$0</span>
                </div>
                <div class="text-xs text-gray-400 mt-1">
                  Includes taxes and fees
                </div>
              </div>
              <div class="mt-6 md:mt-0 flex justify-end">
                <button
                  class="h-10 w-1/3 md:w-full rounded-lg border border-orange-500 text-orange-500 hover:bg-orange-500 hover:text-white transition-colors duration-200"
                >
                  Buy
                </button>
              </div>
            </div>
          </div>
        </div>
      </template>

      <!-- Empty state template -->
      <template id="emptyStateTmpl">
        <div class="bg-white rounded-xl shadow p-10 text-center text-gray-500">
          No flights found. Choose a different route.
        </div>
      </template>
    </div>
  </body>
</html>
