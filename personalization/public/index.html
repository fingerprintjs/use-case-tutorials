<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StayFinder</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="config.js"></script>
    <script src="index.js" defer></script>
  </head>

  <body class="bg-slate-50 text-gray-900 min-h-screen flex flex-col">
    <!-- Header -->
    <header
      class="bg-white border-b border-slate-100 sticky top-0 z-20 shadow-sm"
    >
      <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex items-center gap-4">
        <span class="shrink-0 text-xl font-bold tracking-tight">
          <span class="text-teal-600">Stay</span
          ><span class="text-slate-800">Finder</span>
        </span>
        <div class="flex-1 max-w-xl">
          <div class="relative">
            <svg
              class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-400 pointer-events-none"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="11" cy="11" r="8" />
              <path stroke-linecap="round" d="M21 21l-4.35-4.35" />
            </svg>
            <input
              id="searchInput"
              type="search"
              placeholder="Search by city, name, or description…"
              class="w-full h-9 pl-9 pr-4 rounded-full bg-slate-100 text-sm text-slate-800 placeholder-slate-400 border border-slate-200 focus:outline-none focus:border-teal-400 focus:ring-1 focus:ring-teal-400 focus:bg-white transition"
            />
          </div>
        </div>
      </div>

      <!-- Type category strip -->
      <div class="border-t border-slate-100 bg-white">
        <div
          class="max-w-6xl mx-auto px-4 sm:px-6 py-2 flex gap-2 overflow-x-auto"
        >
          <button
            class="filter-pill shrink-0 flex flex-col items-center gap-0.5 px-4 py-1.5 rounded-xl text-xs font-medium border border-slate-200 bg-white text-slate-500 cursor-pointer transition-colors hover:border-teal-400 hover:text-teal-600 data-[active]:border-teal-500 data-[active]:bg-teal-50 data-[active]:text-teal-700"
            data-filter="type"
            data-value="Entire home"
          >
            <span class="text-base">🏠</span><span>Entire home</span>
          </button>
          <button
            class="filter-pill shrink-0 flex flex-col items-center gap-0.5 px-4 py-1.5 rounded-xl text-xs font-medium border border-slate-200 bg-white text-slate-500 cursor-pointer transition-colors hover:border-teal-400 hover:text-teal-600 data-[active]:border-teal-500 data-[active]:bg-teal-50 data-[active]:text-teal-700"
            data-filter="type"
            data-value="Apartment"
          >
            <span class="text-base">🏢</span><span>Apartment</span>
          </button>
          <button
            class="filter-pill shrink-0 flex flex-col items-center gap-0.5 px-4 py-1.5 rounded-xl text-xs font-medium border border-slate-200 bg-white text-slate-500 cursor-pointer transition-colors hover:border-teal-400 hover:text-teal-600 data-[active]:border-teal-500 data-[active]:bg-teal-50 data-[active]:text-teal-700"
            data-filter="type"
            data-value="Private room"
          >
            <span class="text-base">🛏️</span><span>Private room</span>
          </button>
          <button
            class="filter-pill shrink-0 flex flex-col items-center gap-0.5 px-4 py-1.5 rounded-xl text-xs font-medium border border-slate-200 bg-white text-slate-500 cursor-pointer transition-colors hover:border-teal-400 hover:text-teal-600 data-[active]:border-teal-500 data-[active]:bg-teal-50 data-[active]:text-teal-700"
            data-filter="type"
            data-value="Cabin"
          >
            <span class="text-base">🪵</span><span>Cabin</span>
          </button>
          <button
            class="filter-pill shrink-0 flex flex-col items-center gap-0.5 px-4 py-1.5 rounded-xl text-xs font-medium border border-slate-200 bg-white text-slate-500 cursor-pointer transition-colors hover:border-teal-400 hover:text-teal-600 data-[active]:border-teal-500 data-[active]:bg-teal-50 data-[active]:text-teal-700"
            data-filter="type"
            data-value="Villa"
          >
            <span class="text-base">🏡</span><span>Villa</span>
          </button>
          <button
            class="filter-pill shrink-0 flex flex-col items-center gap-0.5 px-4 py-1.5 rounded-xl text-xs font-medium border border-slate-200 bg-white text-slate-500 cursor-pointer transition-colors hover:border-teal-400 hover:text-teal-600 data-[active]:border-teal-500 data-[active]:bg-teal-50 data-[active]:text-teal-700"
            data-filter="type"
            data-value="Beach house"
          >
            <span class="text-base">🏖️</span><span>Beach house</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Filter panel -->
    <div id="filterPanel" class="bg-white border-b border-slate-200 shadow-sm">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
          <!-- Guests -->
          <div>
            <p
              class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2"
            >
              Guests
            </p>
            <div class="flex flex-wrap gap-1.5">
              <button
                class="filter-pill px-3 py-1 rounded-lg text-xs font-medium border border-slate-200 bg-white text-slate-600 cursor-pointer transition-colors hover:border-teal-400 data-[active]:border-teal-500 data-[active]:bg-teal-500 data-[active]:text-white"
                data-filter="guests"
                data-value="1"
              >
                1+
              </button>
              <button
                class="filter-pill px-3 py-1 rounded-lg text-xs font-medium border border-slate-200 bg-white text-slate-600 cursor-pointer transition-colors hover:border-teal-400 data-[active]:border-teal-500 data-[active]:bg-teal-500 data-[active]:text-white"
                data-filter="guests"
                data-value="2"
              >
                2+
              </button>
              <button
                class="filter-pill px-3 py-1 rounded-lg text-xs font-medium border border-slate-200 bg-white text-slate-600 cursor-pointer transition-colors hover:border-teal-400 data-[active]:border-teal-500 data-[active]:bg-teal-500 data-[active]:text-white"
                data-filter="guests"
                data-value="4"
              >
                4+
              </button>
              <button
                class="filter-pill px-3 py-1 rounded-lg text-xs font-medium border border-slate-200 bg-white text-slate-600 cursor-pointer transition-colors hover:border-teal-400 data-[active]:border-teal-500 data-[active]:bg-teal-500 data-[active]:text-white"
                data-filter="guests"
                data-value="6"
              >
                6+
              </button>
              <button
                class="filter-pill px-3 py-1 rounded-lg text-xs font-medium border border-slate-200 bg-white text-slate-600 cursor-pointer transition-colors hover:border-teal-400 data-[active]:border-teal-500 data-[active]:bg-teal-500 data-[active]:text-white"
                data-filter="guests"
                data-value="8"
              >
                8+
              </button>
            </div>
          </div>

          <!-- Bedrooms -->
          <div>
            <p
              class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2"
            >
              Bedrooms
            </p>
            <div class="flex flex-wrap gap-1.5">
              <button
                class="filter-pill px-3 py-1 rounded-lg text-xs font-medium border border-slate-200 bg-white text-slate-600 cursor-pointer transition-colors hover:border-teal-400 data-[active]:border-teal-500 data-[active]:bg-teal-500 data-[active]:text-white"
                data-filter="bedrooms"
                data-value="1"
              >
                1+
              </button>
              <button
                class="filter-pill px-3 py-1 rounded-lg text-xs font-medium border border-slate-200 bg-white text-slate-600 cursor-pointer transition-colors hover:border-teal-400 data-[active]:border-teal-500 data-[active]:bg-teal-500 data-[active]:text-white"
                data-filter="bedrooms"
                data-value="2"
              >
                2+
              </button>
              <button
                class="filter-pill px-3 py-1 rounded-lg text-xs font-medium border border-slate-200 bg-white text-slate-600 cursor-pointer transition-colors hover:border-teal-400 data-[active]:border-teal-500 data-[active]:bg-teal-500 data-[active]:text-white"
                data-filter="bedrooms"
                data-value="3"
              >
                3+
              </button>
              <button
                class="filter-pill px-3 py-1 rounded-lg text-xs font-medium border border-slate-200 bg-white text-slate-600 cursor-pointer transition-colors hover:border-teal-400 data-[active]:border-teal-500 data-[active]:bg-teal-500 data-[active]:text-white"
                data-filter="bedrooms"
                data-value="4"
              >
                4+
              </button>
            </div>
          </div>

          <!-- Max price -->
          <div>
            <p
              class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2"
            >
              Max price / night
            </p>
            <div class="flex items-center gap-3">
              <input
                id="priceSlider"
                type="range"
                min="0"
                max="1000"
                value="1000"
                step="25"
                class="flex-1 accent-teal-500 cursor-pointer"
              />
              <span
                id="priceLabel"
                class="text-xs font-semibold text-slate-700 w-20 text-right"
                >Any price</span
              >
            </div>
          </div>
        </div>

        <!-- Amenities -->
        <div>
          <p
            class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2"
          >
            Amenities
          </p>
          <div class="flex flex-wrap gap-1.5">
            <button
              class="filter-pill px-3 py-1 rounded-lg text-xs font-medium border border-slate-200 bg-white text-slate-600 cursor-pointer transition-colors hover:border-teal-400 data-[active]:border-teal-500 data-[active]:bg-teal-500 data-[active]:text-white"
              data-filter="amenity"
              data-value="Wifi"
            >
              📶 Wifi
            </button>
            <button
              class="filter-pill px-3 py-1 rounded-lg text-xs font-medium border border-slate-200 bg-white text-slate-600 cursor-pointer transition-colors hover:border-teal-400 data-[active]:border-teal-500 data-[active]:bg-teal-500 data-[active]:text-white"
              data-filter="amenity"
              data-value="Pool"
            >
              🏊 Pool
            </button>
            <button
              class="filter-pill px-3 py-1 rounded-lg text-xs font-medium border border-slate-200 bg-white text-slate-600 cursor-pointer transition-colors hover:border-teal-400 data-[active]:border-teal-500 data-[active]:bg-teal-500 data-[active]:text-white"
              data-filter="amenity"
              data-value="Hot tub"
            >
              ♨️ Hot tub
            </button>
            <button
              class="filter-pill px-3 py-1 rounded-lg text-xs font-medium border border-slate-200 bg-white text-slate-600 cursor-pointer transition-colors hover:border-teal-400 data-[active]:border-teal-500 data-[active]:bg-teal-500 data-[active]:text-white"
              data-filter="amenity"
              data-value="Pet-friendly"
            >
              🐾 Pet-friendly
            </button>
            <button
              class="filter-pill px-3 py-1 rounded-lg text-xs font-medium border border-slate-200 bg-white text-slate-600 cursor-pointer transition-colors hover:border-teal-400 data-[active]:border-teal-500 data-[active]:bg-teal-500 data-[active]:text-white"
              data-filter="amenity"
              data-value="Kitchen"
            >
              🍳 Kitchen
            </button>
            <button
              class="filter-pill px-3 py-1 rounded-lg text-xs font-medium border border-slate-200 bg-white text-slate-600 cursor-pointer transition-colors hover:border-teal-400 data-[active]:border-teal-500 data-[active]:bg-teal-500 data-[active]:text-white"
              data-filter="amenity"
              data-value="Washer"
            >
              🫧 Washer
            </button>
            <button
              class="filter-pill px-3 py-1 rounded-lg text-xs font-medium border border-slate-200 bg-white text-slate-600 cursor-pointer transition-colors hover:border-teal-400 data-[active]:border-teal-500 data-[active]:bg-teal-500 data-[active]:text-white"
              data-filter="amenity"
              data-value="Free parking"
            >
              🚗 Free parking
            </button>
          </div>
        </div>
      </div>
    </div>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8 flex-1 w-full space-y-10">
      <!-- Hot Rentals -->
      <section>
        <div class="flex items-center gap-3 mb-4">
          <h2 class="text-lg font-bold text-slate-800">Hot Rentals</h2>
          <span class="text-xs font-medium text-teal-600 bg-teal-50 px-2 py-0.5 rounded-full">Trending now</span>
        </div>
        <div id="hotRentalsGrid" class="grid grid-cols-1 sm:grid-cols-3 gap-4"></div>
      </section>

      <!-- All Rentals -->
      <section>
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-bold text-slate-800">All Rentals</h2>
          <span id="rentalCount" class="text-sm text-slate-400"></span>
        </div>

        <!-- Loading skeleton -->
        <div
          id="loadingState"
          class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"
        >
          <div class="bg-white rounded-2xl overflow-hidden animate-pulse">
            <div class="h-44 bg-slate-200"></div>
            <div class="p-3 space-y-2">
              <div class="h-3 bg-slate-200 rounded w-3/4"></div>
              <div class="h-3 bg-slate-200 rounded w-1/2"></div>
            </div>
          </div>
          <div
            class="bg-white rounded-2xl overflow-hidden animate-pulse opacity-75"
          >
            <div class="h-44 bg-slate-200"></div>
            <div class="p-3 space-y-2">
              <div class="h-3 bg-slate-200 rounded w-3/4"></div>
              <div class="h-3 bg-slate-200 rounded w-1/2"></div>
            </div>
          </div>
          <div
            class="bg-white rounded-2xl overflow-hidden animate-pulse opacity-50"
          >
            <div class="h-44 bg-slate-200"></div>
            <div class="p-3 space-y-2">
              <div class="h-3 bg-slate-200 rounded w-3/4"></div>
              <div class="h-3 bg-slate-200 rounded w-1/2"></div>
            </div>
          </div>
        </div>

        <!-- Rental list -->
        <div
          id="rentalsList"
          class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"
        ></div>

        <!-- Empty state -->
        <div id="emptyState" class="hidden text-center py-16">
          <p class="text-3xl mb-2">🔍</p>
          <p class="text-sm font-medium text-slate-600">
            No rentals match your search
          </p>
          <p class="text-xs text-slate-400 mt-1">
            Try adjusting your filters or search terms
          </p>
        </div>
      </section>
    </main>

    <footer class="bg-white border-t border-slate-100 mt-auto">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex justify-center">
        <button
          id="resetBtn"
          class="text-xs text-slate-400 hover:text-slate-600 transition-colors"
        >
          Reset demo DB
        </button>
      </div>
    </footer>

    <!-- Rental detail modal -->
    <div id="rentalModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
      <div class="absolute inset-0 bg-black/50" onclick="closeModal()"></div>
      <div class="relative bg-white rounded-2xl overflow-hidden shadow-xl w-full max-w-lg max-h-[90vh] flex flex-col">
        <div class="relative shrink-0">
          <img id="modalImage" alt="" class="w-full h-56 object-cover" />
          <button onclick="closeModal()" class="absolute top-3 right-3 bg-black/40 backdrop-blur-sm text-white rounded-full w-8 h-8 flex items-center justify-center text-sm hover:bg-black/60 transition">✕</button>
          <span id="modalType" class="absolute top-3 left-3 bg-black/30 backdrop-blur-sm text-white text-xs font-semibold px-2 py-0.5 rounded-full"></span>
        </div>
        <div class="overflow-y-auto p-5 space-y-3">
          <div class="flex items-start justify-between gap-2">
            <div>
              <h2 id="modalName" class="text-lg font-bold text-slate-800 leading-snug"></h2>
              <p id="modalLocation" class="text-sm text-slate-500 mt-0.5"></p>
            </div>
            <div class="shrink-0 text-right">
              <span id="modalPrice" class="text-lg font-bold text-teal-600"></span>
              <span class="text-sm text-slate-400">/night</span>
            </div>
          </div>
          <div class="flex items-center gap-2 text-sm">
            <span id="modalRating" class="text-amber-500 font-medium"></span>
            <span id="modalReviews" class="text-slate-400"></span>
            <span class="text-slate-200 mx-1">·</span>
            <span id="modalMeta" class="text-slate-500"></span>
          </div>
          <p id="modalDescription" class="text-sm text-slate-600 leading-relaxed"></p>
          <div>
            <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Amenities</p>
            <div id="modalAmenities" class="flex flex-wrap gap-1.5"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Card template -->
    <template id="rentalCard">
      <article
        class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition-shadow duration-150 cursor-pointer"
      >
        <div class="h-44 relative overflow-hidden">
          <img data-field="image" alt="" class="w-full h-full object-cover" />
          <span
            data-field="type"
            class="absolute top-3 right-3 bg-black/30 backdrop-blur-sm text-white text-xs font-semibold px-2 py-0.5 rounded-full"
          ></span>
          <div
            class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/50 to-transparent p-3"
          >
            <p data-field="location" class="text-xs text-white/90"></p>
          </div>
        </div>
        <div class="p-3">
          <div class="flex items-start justify-between gap-2">
            <h3
              data-field="name"
              class="font-semibold text-slate-800 text-sm leading-snug line-clamp-1 flex-1"
            ></h3>
            <div class="shrink-0 text-right">
              <span
                data-field="price"
                class="text-sm font-bold text-teal-600"
              ></span>
              <span class="text-xs text-slate-400">/night</span>
            </div>
          </div>
          <div class="flex items-center gap-1 mt-0.5">
            <span
              data-field="rating"
              class="text-xs text-amber-500 font-medium"
            ></span>
            <span data-field="reviews" class="text-xs text-slate-400"></span>
            <span class="text-slate-200 mx-1">·</span>
            <span data-field="meta" class="text-xs text-slate-500"></span>
          </div>
          <div data-field="amenities" class="mt-2 flex gap-1 flex-wrap"></div>
        </div>
      </article>
    </template>
  </body>
</html>
