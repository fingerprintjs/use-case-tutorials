<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="config.js"></script>
    <script src="index.js" defer></script>
  </head>

  <body class="bg-gray-50 min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md">
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-8">
        <h1 class="text-center text-2xl font-semibold text-gray-900 mb-6">
          Log in
        </h1>

        <div class="space-y-4">
          <!-- Username -->
          <div>
            <label
              for="emailInput"
              class="block text-sm font-medium text-gray-700 mb-1"
            >
              Username
            </label>
            <input
              id="emailInput"
              type="email"
              placeholder="Username"
              class="w-full rounded-md border border-gray-300 px-3 py-2 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500"
            />
          </div>

          <!-- Password -->
          <div>
            <label
              for="passwordInput"
              class="block text-sm font-medium text-gray-700 mb-1"
            >
              Password
            </label>
            <div class="relative">
              <input
                id="passwordInput"
                type="password"
                placeholder="••••••••"
                class="w-full rounded-md border border-gray-300 px-3 py-2 pr-10 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500"
              />
            </div>
          </div>

          <!-- Result message -->
          <div
            id="resultBox"
            class="hidden mt-2 flex items-center justify-between gap-2 text-sm px-4 py-2 rounded"
          >
            <div class="flex items-center gap-2">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-4 w-4 flex-shrink-0"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                id="resultIcon"
              ></svg>
              <span id="resultMessage"></span>
            </div>

            <button
              id="clearResult"
              class="text-gray-600 text-sm flex-shrink-0"
              type="button"
              aria-label="Close message"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-4 w-4 text-gray-600"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M6 18L18 6M6 6l12 12"
                />
              </svg>
            </button>
          </div>

          <!-- Submit -->
          <button
            id="loginBtn"
            type="button"
            class="w-full bg-orange-500 hover:bg-orange-600 text-white font-medium rounded-md py-2 transition"
          >
            Log in
          </button>
        </div>

        <p class="text-center text-sm text-gray-600 mt-6">
          Don't have an account yet?
          <a href="#" class="text-orange-600 hover:text-orange-700 underline"
            >Sign up first</a
          >
        </p>
      </div>

      <!-- Reset DB link -->
      <p
        id="resetDBLink"
        class="text-center text-sm text-gray-400 hover:text-gray-600 mt-4 cursor-pointer"
      >
        Reset demo DB
      </p>
    </div>
  </body>
</html>
