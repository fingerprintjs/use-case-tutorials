<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gift Card Checkout</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="config.js"></script>
    <script src="index.js" defer></script>
  </head>

  <body class="bg-gray-50">
    <div class="min-h-screen flex flex-col items-center justify-center p-6">
      <section
        class="w-full max-w-3xl bg-white rounded-xl shadow border border-gray-200 p-6 space-y-6"
      >
        <h1 class="text-2xl font-semibold text-gray-900">Gift Card Checkout</h1>

        <!-- Order summary -->
        <div class="border border-gray-200 rounded-lg">
          <div class="p-4 space-y-4">
            <div class="flex items-center gap-4">
              <div
                class="h-16 w-16 rounded-md bg-gray-100 flex items-center justify-center"
              >
                <img
                  src="/giftcard.svg"
                  alt="Digital Gift Card"
                  class="w-16 h-16 rounded border"
                />
              </div>
              <div class="flex-1">
                <p class="text-sm font-medium text-gray-900">
                  Digital Gift Card
                </p>
                <p class="text-xs text-gray-500">Delivered by email</p>
              </div>
              <div class="text-right text-sm">
                <p class="text-gray-500 text-xs">Amount:</p>
                <p class="text-gray-900 font-medium">$5.00</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Shipping address -->
        <div class="border border-gray-200 rounded-lg p-4 space-y-3 bg-gray-50">
          <h2 class="text-base font-semibold text-gray-900">
            Recipient email address
          </h2>

          <p class="text-sm text-gray-700">jamiedoe@example.com</p>
        </div>

        <!-- Payment details -->
        <div class="border border-gray-200 rounded-lg p-4 space-y-4">
          <h2 class="text-base font-semibold text-gray-900">Payment details</h2>

          <div>
            <label
              for="cardNumber"
              class="block text-sm font-medium text-gray-800 mb-1"
            >
              Card number
            </label>
            <input
              id="cardNumber"
              type="text"
              inputmode="numeric"
              placeholder="4242424242424242"
              class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-900 placeholder-gray-400 shadow-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500"
            />
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="sm:col-span-1">
              <label
                for="cardExp"
                class="block text-sm font-medium text-gray-800 mb-1"
              >
                Expiration
              </label>
              <input
                id="cardExp"
                type="text"
                placeholder="04/28"
                class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-900 placeholder-gray-400 shadow-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500"
              />
            </div>

            <div class="sm:col-span-1">
              <label
                for="cardCvv"
                class="block text-sm font-medium text-gray-800 mb-1"
              >
                CVV
              </label>
              <input
                id="cardCvv"
                type="text"
                inputmode="numeric"
                placeholder="123"
                class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm text-gray-900 placeholder-gray-400 shadow-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500"
              />
            </div>
          </div>
        </div>

        <!-- Result message -->
        <div
          id="resultBox"
          class="hidden mt-2 text-sm px-4 py-2 rounded flex justify-between items-center"
        >
          <span id="resultMessage"></span>
          <button id="clearResult" type="button" aria-label="Close message">
            &times;
          </button>
        </div>

        <!-- CTA -->
        <div class="flex justify-center">
          <button
            id="placeOrderBtn"
            class="rounded-lg bg-orange-500 hover:bg-orange-600 text-white px-8 py-3 text-sm font-medium"
          >
            Place order
          </button>
        </div>
      </section>

      <!-- Reset DB link -->
      <p
        id="resetDBLink"
        class="text-center text-sm text-gray-400 hover:text-gray-600 mt-4 cursor-pointer"
      >
        Reset demo DB
      </p>
    </div>
  </body>
</html>
